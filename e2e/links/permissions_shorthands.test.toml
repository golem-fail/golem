[flow]
# Covers the cross-platform permission value paths that fan out per platform:
# `location = "always"` (Android: grants both FINE_LOCATION and
# BACKGROUND_LOCATION; iOS: maps to the simctl `location-always` token) and
# `photos = "limited"` (Android 14+: READ_MEDIA_VISUAL_USER_SELECTED only; iOS:
# applesimutils `photos=limited`). Permissions are applied via a launch's
# `permissions =` map; a mapping failure surfaces as the launch step failing —
# `pm grant` / `simctl privacy` / `applesimutils` reject undeclared or
# wrong-API-level permissions loudly, which propagates through the driver.
name = "Permission modes"
tags = ["permissions", "cross-platform"]

[[flow.apps]]
name = "app"
[[flow.apps.devices]]
os = ["ios:latest", "android:latest"]
type = "phone"

[[block]]
name = "location_always_grants_foreground_and_background"
steps = [
  { action = "launch", app = "app", permissions = { location = "always" } },
  { action = "assert_visible", on_text = "Counter" },
]

[[block]]
name = "photos_limited_partial_access"
steps = [
  { action = "launch", app = "app", permissions = { photos = "limited" } },
  { action = "assert_visible", on_text = "Counter" },
]
