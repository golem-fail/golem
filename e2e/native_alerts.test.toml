[flow]
name = "Native alert dialog test"
tags = ["cross-platform", "alert", "dialog"]

[[flow.apps]]
name = "app"
[[flow.apps.devices]]
os = ["ios:latest", "android:latest"]
type = "phone"

# Alert dialog: single OK button
[[block]]
name = "alert_accept"
steps = [
  { action = "assert_visible", on_text = "Submit" },
  { action = "tap", on_text = "Show Alert", auto_scroll = true },
  { action = "assert_alert" },
  { action = "assert_alert", on_text = "This is a test alert" },
  { action = "accept_alert" },
  # Alert close animation + state update + re-render — default 10s
  # can underflow under sweep load on slower Android emulators. The
  # 500ms-delayed second eval in `deliver_dialog_result` covers slow
  # WebViews that drop the first delivery; auto_scroll guards against
  # a state change that scrolled the lastResult row off-screen.
  { action = "assert_visible", on_text = "Alert dismissed", timeout = 15000, auto_scroll = true },
]

# Confirm dialog: OK and Cancel buttons
[[block]]
name = "confirm_accept"
steps = [
  { action = "tap", on_text = "Show Confirm" },
  { action = "assert_alert" },
  { action = "assert_alert", on_text = "Are you sure?" },
  { action = "accept_alert" },
  { action = "assert_visible", on_text = "Confirm OK" },
]

[[block]]
name = "confirm_dismiss"
steps = [
  { action = "tap", on_text = "Show Confirm" },
  { action = "assert_alert" },
  { action = "dismiss_alert" },
  { action = "assert_visible", on_text = "Confirm Cancel" },
]

# Yes/No dialog
[[block]]
name = "yes_no_accept"
steps = [
  { action = "tap", on_text = "Show Yes/No" },
  { action = "assert_alert" },
  { action = "assert_alert", on_text = "Do you agree?" },
  { action = "accept_alert" },
  { action = "assert_visible", on_text = "Question Yes" },
]

[[block]]
name = "yes_no_dismiss"
steps = [
  { action = "tap", on_text = "Show Yes/No" },
  { action = "assert_alert" },
  { action = "dismiss_alert" },
  { action = "assert_visible", on_text = "Question No" },
]

# Branch on an alert, then check that it went. No else: if the alert does
# not show, the flow fails with EF406.
[[block]]
name = "branch_on_alert"
steps = [{ action = "tap", on_text = "Show Confirm" }]
branch = [{ if_alert = "Are you sure*", goto = "answer_alert" }]

[[block]]
name = "answer_alert"
steps = [
  { action = "accept_alert" },
  { action = "assert_no_alert" },
  { action = "assert_visible", on_text = "Confirm OK" },
]
