[flow]
name = "Capacitor lifecycle test"
tags = ["cross-platform", "capacitor", "lifecycle"]

# Minimal Capacitor (test-app-c) flow. Its job is to prove the Capacitor
# install script builds, installs, launches, and drives — not to test app
# logic. The app keeps Capacitor's default iOS `contentInset`, so the tap
# also covers WebView coordinate mapping for a page that is not inset (#266).
[[flow.apps]]
name = "app-c"
[[flow.apps.devices]]
os = ["ios:latest", "android:latest"]
type = "phone"

[[block]]
name = "counter"
steps = [
  { action = "assert_visible", on_text = "Counter" },
  { action = "tap", on_text = "+" },
  { action = "assert_visible", on_text = "1", on_below = "Counter" },
]
