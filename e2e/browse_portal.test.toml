[flow]
name = "browse portal"
tags = ["cross-platform", "browser", "external"]

# The browser leg end to end, in the shape it exists for: a mobile flow needs
# web state it can only reach through a portal, drives that portal itself, then
# carries the result back into the app under test. The page is served over
# loopback rather than embedded as a `data:` URL — an opaque origin has no
# cookies, no storage and no WebMCP, so only a real origin can exercise the
# whole surface later.

[flow.options]
# One device is enough: the browser half is identical everywhere, and the mobile
# half only proves the captured value crosses back into the app.
coverage = "one"

[[flow.apps]]
name = "app"
[[flow.apps.devices]]
os = ["ios:latest", "android:latest"]
type = "phone"

[[block]]
name = "portal"
steps = [
  # Prints the URL; `save_to` captures stdout, so the port is never guessed.
  { action = "run", script = "scripts/serve-browse-page.sh", save_to = "portal" },

  { action = "browse_navigate", url = "${portal.stdout}" },
  { action = "browse_assert_text", selector = "h1", text = "Golem Portal" },
  { action = "browse_assert_exists", selector = "#fulfil" },

  { action = "browse_type", selector = "#order", text = "o-42" },
  { action = "browse_tap", selector = "#fulfil" },

  # The page rewrites this after the click, so passing proves the assertion
  # waits rather than reading whatever was there when the step began.
  { action = "browse_assert_text", selector = "#status", text = "Fulfilled *" },
  { action = "browse_assert_not_exists", selector = "#error" },

  # An attribute carries the machine-readable value the rendered text buries.
  { action = "browse_read", selector = "#status", attribute = "data-order", save_to = "order_id" },

  # Back to the app under test: the browser is instrumentation, and this is the
  # step that proves what it fetched actually reaches the thing golem tests.
  { action = "tap", on_accessibility_label = "menu-toggle" },
  { action = "tap", on_accessibility_label = "goto-text-fields" },
  { action = "type", on_text = "Search", input = "${order_id}", auto_scroll = true },
  { action = "assert_visible", on_text = "o-42" },
]

[[block]]
name = "portal_state"
# The rest of the browser surface, against the same real origin. Cookies and
# web storage need one — they are absent on an opaque origin — and so does
# WebMCP, which golem enables automatically because this block uses it.
steps = [
  # A script sees flow variables; a file would not. `${order_id}` came from the
  # page itself two steps ago, so this also proves the round trip.
  { action = "browse_execute_js", script = "return 'order-' + '${order_id}'", save_to = "js_result" },

  { action = "browse_set_local_storage", key = "cart", value = "{\"items\": 2}" },
  { action = "browse_get_local_storage", key = "cart", save_to = "cart" },
  # Session storage is a separate area: writing one must not answer for the other.
  { action = "browse_set_session_storage", key = "step", value = "checkout" },
  { action = "browse_get_session_storage", key = "step", save_to = "step" },
  { action = "browse_set_cookie", name = "session", value = "s-${order_id}" },
  { action = "browse_get_cookie", name = "session", save_to = "session" },

  { action = "browse_select", selector = "#region", value = "eu" },
  { action = "browse_scroll_by", amount = 200 },
  { action = "browse_scroll_to", selector = "#status" },
  { action = "browse_wait_exists", selector = "#region" },

  # WebMCP: the page declares a tool, golem lists it and calls it. Reaching
  # here at all proves the auto-enable path — the feature ships switched off.
  { action = "browse_mcp_list_tools", save_to = "tools" },
  { action = "browse_mcp_call", tool = "note_region", arguments = { region = "${cart.items}" }, save_to = "noted" },
  { action = "browse_assert_text", selector = "#log", text = "region:2" },
  { action = "browse_wait_not_exists", selector = "#never-appears", timeout = 300 },

  { action = "browse_screenshot" },

  # The browser→app crossing is proven in the first block; repeating it here
  # would target the same field by its placeholder, which is gone once that
  # block typed into it. Prove the variable round-trip in the browser instead:
  # a value golem captured earlier goes back into the page and is asserted.
  { action = "browse_execute_js", script = "document.getElementById('log').textContent = '${js_result}'" },
  { action = "browse_assert_text", selector = "#log", text = "order-o-42" },
]

[[teardown]]
steps = [
  { action = "browse_close" },
  { action = "run", script = "scripts/stop-browse-page.sh" },
]
