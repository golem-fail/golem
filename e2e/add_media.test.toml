[flow]
name = "add_media lands an image in the gallery"
tags = ["cross-platform", "media"]

# add_media coverage (#78 / #117). add_media puts a photo in the device gallery;
# test-app-b's photo-read section reads the photo library and renders the added
# image's pixel dimensions — the observable effect of the action, asserted
# through the app UI.
#
# One flow, both platforms, no platform-specific steps:
#  - Android add_media indexes the pushed file into MediaStore; iOS `simctl
#    addmedia` indexes into PhotoKit — so the app sees it either way.
#  - Photo access is PRE-GRANTED at launch via the app's `permissions` map:
#    Android via `pm grant`, iOS via `applesimutils` (`simctl privacy grant
#    photos` can't suppress the iOS 26 library prompt — applesimutils can, and
#    #124 routes photos through it). When applesimutils is installed the grant
#    is prompt-free and the `accept_alert` below is a no-op; when it isn't, the
#    grant warns (`golem doctor` flags the missing tool) and the runtime prompt
#    fires — `accept_alert` (if_fail=ignore) dismisses it so the flow stays
#    portable either way. See docs/actions-reference.md#app-permissions.
[[flow.apps]]
name = "app-b"
bundle = "fail.golem.testb"
install_script = { ios = "scripts/install-app-b-ios.sh", android = "scripts/install-app-b-android.sh" }
permissions = { photos = "allow" }
[[flow.apps.devices]]
os = ["ios:latest", "android:latest"]
type = "phone"

[[block]]
name = "add_and_observe"
steps = [
  { action = "add_media", path = "e2e/__fixtures__/sample_media.png" },
  { action = "assert_visible", on_text = "Dims: pending" },
  { action = "tap", on_accessibility_label = "load-gallery" },
  # Portable net: a no-op when photos was pre-granted prompt-free (applesimutils
  # on iOS, pm grant on Android); dismisses the runtime prompt if the pre-grant
  # couldn't be applied (e.g. applesimutils not installed). See header.
  { action = "accept_alert", if_fail = "ignore", timeout = 12000 },
  # The app renders the added image's actual pixel size; the fixture is 7x11.
  { action = "assert_visible", on_text = "Dims: 7x11", timeout = 30000 },
]
