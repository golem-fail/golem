name: Release note

# Ensure every human PR carries a release-notes block (feeds scripts/release-notes.sh).
# This is a REQUIRED status check, so the job must ALWAYS run and always report a
# conclusion — a job skipped via a job-level `if:` leaves the required check
# "expected" forever and blocks the PR. So the bot / `no-release-note` exemption
# lives inside scripts/check-release-note.sh (exit 0), not in a job condition.
#
# The validation itself lives in that script rather than inline here so it can be
# tested (scripts/tests/release-note-check.test.sh, run by `cargo t`) — untested
# logic in a required gate blocks the whole repo when it is wrong.

on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
      - name: Require a release-notes block
        env:
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: printf '%s\n' "$BODY" | bash scripts/check-release-note.sh
