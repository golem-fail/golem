[package]
name = "golem-orchestrator"
version.workspace = true
edition = "2021"

[features]
# Empty by design — see golem-browser/Cargo.toml; the binary owns the default.
default = []
# Forwards to golem-browser: with it the suite preflight probes for a real
# Chrome, without it a browser flow is rejected as unservable by this build.
browser = ["golem-browser/browser"]

[dependencies]
golem-browser = { path = "../golem-browser" }
golem-parser = { path = "../golem-parser" }
golem-devices = { path = "../golem-devices" }
golem-runner = { path = "../golem-runner" }
golem-events = { path = "../golem-events" }
golem-driver = { path = "../golem-driver" }
golem-element = { path = "../golem-element" }
golem-report = { path = "../golem-report" }
golem-vars = { path = "../golem-vars" }
golem-common = { path = "../golem-common" }
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
dirs = "6"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
