<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GOLEM Test App C</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; }
    .row { display: flex; gap: 12px; }
    button { font-size: 24px; min-width: 96px; min-height: 56px; }
  </style>
</head>
<body>
  <main>
    <h1>Counter</h1>
    <p id="count" aria-label="count">0</p>
    <div class="row">
      <button aria-label="Increment" id="increment">+</button>
      <button aria-label="Decrement" id="decrement">-</button>
    </div>
    <section>
      <h2>About</h2>
      <p>Minimal Capacitor app for golem's Capacitor install-script template.</p>
      <ul>
        <li>Web build: npm run build</li>
        <li>Native sync: cap sync</li>
        <li>Android: Gradle and adb</li>
        <li>iOS: xcodebuild and simctl</li>
      </ul>
    </section>
  </main>
  <script>
    let count = 0;
    const out = document.getElementById('count');
    document.getElementById('increment').addEventListener('click', () => { out.textContent = ++count; });
    document.getElementById('decrement').addEventListener('click', () => { out.textContent = --count; });
  </script>
</body>
</html>
