[package]
name = "golem-browser"
version.workspace = true
edition = "2021"

[features]
# Deliberately empty. `golem-cli` owns the default (`browser` is on there), and
# the libraries only forward it — a default here would re-enable the engine
# through the dependency chain and make `--no-default-features` on the binary a
# lie. Everything that *diagnoses* a browser flow — session grammar, preflight,
# failure codes — compiles without the engine either way.
default = []
browser = ["dep:chromiumoxide", "dep:futures", "dep:tokio", "dep:golem-vars", "dep:tempfile", "dep:golem-element", "dep:serde_json", "dep:toml"]

[dependencies]
golem-events = { path = "../golem-events" }
golem-parser = { path = "../golem-parser" }
# Only the action handlers touch the variable store (`save_to`), and they are
# feature-gated, so the no-engine build doesn't pull it in.
golem-vars = { path = "../golem-vars", optional = true }
# `glob_match` — browser text assertions match the way mobile ones do.
golem-element = { path = "../golem-element", optional = true }
# Results of `browse_execute_js`, and safe JS literals for `browse_select`.
serde_json = { workspace = true, optional = true }
# Step params arrive as `toml::Value`; `browse_mcp_call` converts an inline
# table of arguments into the JSON a WebMCP tool expects.
toml = { workspace = true, optional = true }
anyhow = { workspace = true }
chromiumoxide = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
tokio = { workspace = true, optional = true }
# Per-pool Chrome profile directory (see pool::launch).
tempfile = { version = "3", optional = true }

[dev-dependencies]
toml = { workspace = true }
tempfile = "3"

[lints]
workspace = true
