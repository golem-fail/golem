[package]
name = "golem-browser"
version.workspace = true
edition = "2021"

[features]
# Deliberately empty. `golem-cli` owns the default (`browser` is on there), and
# the libraries only forward it — a default here would re-enable the engine
# through the dependency chain and make `--no-default-features` on the binary a
# lie. Everything that *diagnoses* a browser flow — session grammar, preflight,
# failure codes — compiles without the engine either way.
default = []
browser = ["dep:chromiumoxide", "dep:futures", "dep:tokio"]

[dependencies]
golem-events = { path = "../golem-events" }
golem-parser = { path = "../golem-parser" }
anyhow = { workspace = true }
chromiumoxide = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
toml = { workspace = true }

[lints]
workspace = true
